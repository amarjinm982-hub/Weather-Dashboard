<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Weather Dashboard</h1>

        <button id="themeToggle">🌙 Dark Mode</button>

        <div class="search-section">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter a city..."
                autocomplete="off"
            >

            <button id="searchBtn">Search</button>

        </div>

        <div id="loading" class="loading">

            <div class="spinner"></div>

            <p>Loading weather...</p>

        </div>

        <div id="error" class="error" style="display: none;">

            <p>City not found! Please enter a valid city name.</p>

        </div>

        <div class="weather-card">

            <h2 id="cityName">Paris</h2>

            <p id="weatherDate">Thursday, 12:01</p>

            <p id="description">Clear Sky</p>

            <div class="weather-info">

                <div class="temperature">

                    <span id="weatherIcon">☀️</span>

                    <h1 id="temperature">15°C</h1>

                </div>

                <div class="weather-details">

                    <p>💧 Humidity: <span id="humidity">72%</span></p>

                    <p>💨 Wind Speed: <span id="windSpeed">3.09 km/h</span></p>

                    <p>Feels Like: <span id="feelsLike">14°C</span></p>

                </div>

            </div>

            <button id="favoriteBtn">⭐ Add to Favorites</button>

        </div>

        <div class="forecast-section">

            <h2>5-Day Forecast</h2>

            <div class="forecast-container" id="forecastContainer">

                <!-- Forecast cards will appear here dynamically -->

            </div>

        </div>

        <div class="favorites-section">

            <h2>⭐ Favorite Cities</h2>

            <div id="favoritesList">

                <p>No favorite cities added yet.</p>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
